services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    container_name: sqlserver-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrong!Password123}
      - MSSQL_TCP_PORT=1433
    ports:
      - "1433:1433"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-server
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_USER:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD:-admin}
    ports:
      - "8080:8080"
    command: start-dev

  unleash-db:
    image: postgres:15-alpine
    container_name: unleash-postgres
    environment:
      - POSTGRES_DB=unleash
      - POSTGRES_USER=unleash_user
      - POSTGRES_PASSWORD=unleash_password
    ports:
      - "5432:5432"

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: unleash-server
    ports:
      - "4242:4242"
    environment:
      - DATABASE_URL=postgres://unleash_user:unleash_password@unleash-db/unleash
      - DATABASE_SSL=false
      - LOG_LEVEL=info
    depends_on:
      - unleash-db